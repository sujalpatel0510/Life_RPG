    </noscript>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('liferpg_theme');
          var prefersLight = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (prefersLight ? 'light' : 'dark');
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased min-h-screen bg-rpg-light-bg dark:bg-rpg-dark-bg text-slate-900 dark:text-rpg-light-bg transition-colors duration-300 selection:bg-rpg-primary-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
